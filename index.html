<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="google-site-verification" content="B5o_0p-0IT7ei8Pkidd-iL90Eb-7Q8Ywy0uq977WAK0" />

<title>Spanish Radio</title>

<link rel="stylesheet" href="styles.css">

</head>


<body>


<div class="container">

<div class="radio" id="radio">


<div class="speaker"></div>


<div class="station">

<div class="live">
● ON AIR
</div>


<div class="logo">
<span>SPANISH</span> RADIO
</div>


<div id="frequency" class="frequency">
98.7 FM
</div>


<div id="channelName" class="channel">
WORDS FM
</div>


<div id="description" class="description">
5000 MOST USED WORDS
</div>

</div>




<div class="display">

<div id="phrase" class="phrase">
Bienvenido
</div>


<div id="translation" class="translation">
Dein Sprachradio
</div>

</div>




<div class="wave">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>





<div class="controls">


<button id="prevChannel" class="channel-button">
◀
</button>


<button id="playButton" class="play-button">
▶
</button>


<button id="nextChannel" class="channel-button">
▶
</button>


</div>





<div class="speed-box">


<div id="speedValue" class="speed-value">
NORMAL
</div>


<input
id="level"
type="range"
min="1"
max="6"
value="3"
>


</div>



</div>

</div>



<script src="script.js"></script>


</body>

</html>
